model:
  # Change this if your exact Qwen checkpoint is different.
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  trust_remote_code: true
  use_flash_attention_2: false

data:
  train_file: data/train.jsonl
  validation_file: data/dev.jsonl
  test_file: data/test.jsonl
  # Supported schemas: auto, messages, instruction, text.
  schema: auto
  max_length: 2048
  num_proc: 4
  system_prompt: "Bạn là trợ lý pháp luật hữu ích, chính xác và thận trọng."

qlora:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: outputs/qwen2.5-7b-legal-qlora
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.0
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  gradient_checkpointing: true
  max_grad_norm: 0.3
  seed: 42
  report_to: none
  resume_from_checkpoint: null
