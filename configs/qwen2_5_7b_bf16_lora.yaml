model:
  # Hugging Face model ID or a local directory containing the base model.
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  trust_remote_code: true
  dtype: bfloat16
  # "sdpa" needs no extra package and uses optimized PyTorch attention kernels.
  # Change to "flash_attention_2" only after installing flash-attn.
  attn_implementation: sdpa

data:
  train_file: data/train.jsonl
  validation_file: data/dev.jsonl
  test_file: data/test.jsonl
  # Supported schemas: auto, messages, instruction, text.
  schema: auto
  max_length: 2048
  num_proc: 4
  system_prompt: "Bạn là trợ lý pháp luật hữu ích, chính xác và thận trọng."

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: outputs/qwen2.5-7b-legal-bf16-lora
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 0.0001
  warmup_ratio: 0.03
  weight_decay: 0.0
  lr_scheduler_type: cosine
  optim: adamw_torch_fused
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  gradient_checkpointing: true
  max_grad_norm: 1.0
  tf32: true
  group_by_length: true
  dataloader_num_workers: 4
  seed: 42
  report_to: none
  resume_from_checkpoint: null
